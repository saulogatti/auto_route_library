name: auto_route
description: AutoRoute is a declarative routing solution, where everything needed for navigation is automatically generated for you.
version: 11.2.0
homepage: https://github.com/Milad-Akarie/auto_route_library
screenshots:
  - description: 'Auto Route Logo'
    path: art/auto_route_logo.png
topics:
  - navigation
  - routing
  - auto-route
  - nested-navigation
  - deep-linking

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  web: ^1.1.1
  collection: ^1.19.1
  meta: ^1.19.0


  cupertino_ui: ^1.1.3
  material_ui: ^1.7.0
dev_dependencies:
  build_runner: ^2.16.2
  mockito: ^5.8.1
  auto_route_generator: ^10.6.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  auto_route_generator:
    path: ../auto_route_generator


