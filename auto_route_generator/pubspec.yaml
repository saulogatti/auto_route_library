name: auto_route_generator
description: AutoRoute is a declarative routing solution, where everything needed for navigation is automatically generated for you.
version: 10.6.0
homepage: https://github.com/Milad-Akarie/auto_route_library
publish_to: none
environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  build: ">=3.0.2 <5.0.0"
  source_gen: ^4.3.1
  analyzer: ^14.5.0
  path: ^1.9.1
  code_builder: ^4.13.0
  dart_style: ^3.1.14
  glob: ^2.2.0
  lean_builder: 
    git:
      url: https://github.com/saulogatti/lean_builder.git
      ref: update

  auto_route: ^11.2.0

dev_dependencies:
  lints: ^6.1.0
  build_runner: ^2.16.2
 